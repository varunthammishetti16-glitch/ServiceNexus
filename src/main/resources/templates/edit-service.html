
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Service - ServiceNexus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main>
        <h1>Edit Service</h1>
        <p>Update the details of your service listing.</p>

        <form th:action="@{/worker/services/{id}/edit(id=${service.id})}"
              th:object="${service}"
              method="post">

            <label for="name">Service Name</label>
            <input type="text" id="name" th:field="*{name}"
                   required maxlength="100">

            <label for="category">Category</label>
            <input type="text" id="category" th:field="*{category}"
                   required maxlength="100">

            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}"
                      required maxlength="1000"></textarea>

            <label for="price">Price</label>
            <input type="number" id="price" th:field="*{price}"
                   min="0.01" step="0.01" required>

            <label for="location">Location</label>
            <input type="text" id="location" th:field="*{location}"
                   required maxlength="200">

            <button type="submit">Save Changes</button>
        </form>

        <p><a th:href="@{/worker}">Cancel and return to dashboard</a></p>
    </main>
</body>
</html>
