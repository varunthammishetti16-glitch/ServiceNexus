<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ServiceNexus</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            font-family: 'DM Sans', sans-serif;
            color: #25332d;
            background:
                radial-gradient(circle at 10% 10%, #e0f3e7, transparent 35%),
                radial-gradient(circle at 90% 90%, #d9eee1, transparent 35%),
                #f5f8f6;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            animation: appear .6s ease;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
            font-family: 'Manrope', sans-serif;
            font-size: 29px;
            font-weight: 800;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            margin-right: 7px;
            border-radius: 11px;
            color: white;
            background: #198754;
        }

        .brand-dot { color: #198754; }

        .auth-card {
            padding: 38px;
            background: white;
            border: 1px solid #e3ebe6;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(20, 50, 35, .08);
        }

        .eyebrow {
            color: #198754;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 10px 0;
            text-align: center;
            font-family: 'Manrope', sans-serif;
            font-size: 29px;
            font-weight: 800;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #667085;
            text-align: center;
            font-size: 14px;
        }

        .field { margin-bottom: 19px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dce5df;
            border-radius: 10px;
            outline: none;
            font: inherit;
            transition: .2s ease;
        }

        input:focus {
            border-color: #198754;
            box-shadow: 0 0 0 4px rgba(25, 135, 84, .12);
        }

        .password-wrap { position: relative; }

        .password-wrap input { padding-right: 65px; }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 13px;
            transform: translateY(-50%);
            border: 0;
            background: none;
            color: #198754;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: #198754;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }

        .submit-btn:hover {
            background: #146c43;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(25, 135, 84, .2);
        }

        .message {
            margin: 15px 0;
            text-align: center;
            font-size: 14px;
        }

        .error { color: #dc3545; }
        .success { color: #198754; }

        .auth-footer {
            margin-top: 24px;
            color: #667085;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #198754;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        .back-link {
            display: block;
            margin-top: 23px;
            color: #667085;
            text-align: center;
            font-size: 13px;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .auth-card { padding: 27px 22px; }
            h1 { font-size: 25px; }
        }
    </style>
</head>

<body>
<div class="auth-container">

    <div class="brand">
        <span class="brand-icon">S</span>ServiceNexus<span class="brand-dot">.</span>
    </div>

    <div class="auth-card">
        <div class="eyebrow">Welcome Back</div>
        <h1>Sign in to your account</h1>
        <p class="subtitle">Connect with your local service community.</p>

        <p class="message error" th:if="${param.error}">
            Invalid email or password. Please try again.
        </p>

        <p class="message success" th:if="${param.logout}">
            You have been logged out successfully.
        </p>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="field">
                <label for="username">Email Address</label>
                <input type="email" id="username" name="username"
                       placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle-password"
                            onclick="togglePassword()">Show</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">Sign In ?</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Create Account</a>
        </div>
    </div>

    <a href="/" class="back-link">? Back to Home</a>
</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const button = document.querySelector(".toggle-password");

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "Hide";
        } else {
            password.type = "password";
            button.textContent = "Show";
        }
    }
</script>
</body>
</html>
