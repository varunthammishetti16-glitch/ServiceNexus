
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Worker Profile - ServiceNexus</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #f4f8f5;
            font-family: Arial, sans-serif;
            color: #20332b;
        }

        .profile-container {
            max-width: 1000px;
            margin: auto;
        }

        .profile-header {
            background: white;
            padding: 25px 30px;
            border-radius: 14px;
            margin-bottom: 30px;
            border: 1px solid #e1ebe4;
        }

        .profile-header h1 {
            color: #07865f;
            margin: 0 0 10px;
            font-size: 32px;
        }

        .profile-header p {
            color: #64756b;
            margin: 0;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #e1ebe4;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            margin-bottom: 25px;
        }

        .profile-card h2 {
            color: #07865f;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            color: #34483d;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid #d6e2da;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #fbfdfb;
        }

        input:focus, textarea:focus {
            border-color: #07865f;
            box-shadow: 0 0 0 3px rgba(7,134,95,0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .save-button {
            margin-top: 25px;
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            background: #07865f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #066c4c;
        }

        .message {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #e4f7ec;
            color: #176b3b;
        }

        .error-message {
            background: #fde8e8;
            color: #b42318;
        }

        .saved-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .detail-item {
            padding: 17px;
            background: #f4f8f5;
            border-radius: 9px;
        }

        .detail-item strong {
            display: block;
            color: #07865f;
            margin-bottom: 8px;
        }

        .detail-item p {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 22px;
            border-radius: 8px;
            background: #07865f;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            background: #066c4c;
        }

        @media (max-width: 650px) {
            body {
                padding: 20px 12px;
            }

            .form-grid, .saved-details {
                grid-template-columns: 1fr;
            }

            .profile-card {
                padding: 20px;
            }

            .profile-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<main class="profile-container">

    <header class="profile-header">
        <h1>Worker Profile</h1>
        <p>Manage your professional information on ServiceNexus.</p>
    </header>

    <p th:if="${success}"
       th:text="${success}"
       class="message success-message"
       role="status"></p>

    <p th:if="${error}"
       th:text="${error}"
       class="message error-message"
       role="alert"></p>

    <!-- Edit Profile -->
    <section class="profile-card">

        <h2>Update Your Profile</h2>

        <form th:action="@{/worker/profile}"
              th:object="${profile}"
              method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           maxlength="100"
                           required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel"
                           id="phone"
                           th:field="*{phone}"
                           maxlength="20"
                           required>
                </div>

                <div class="form-group">
                    <label for="skills">Skills</label>
                    <input type="text"
                           id="skills"
                           th:field="*{skills}"
                           maxlength="100"
                           required>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text"
                           id="location"
                           th:field="*{location}"
                           maxlength="200"
                           required>
                </div>

                <div class="form-group full-width">
                    <label for="description">About You</label>
                    <textarea id="description"
                              th:field="*{description}"
                              maxlength="1000"
                              placeholder="Describe your experience and professional skills..."></textarea>
                </div>

            </div>

            <button type="submit" class="save-button">
                Save Profile
            </button>

        </form>

    </section>

    <!-- Saved Profile -->
    <section class="profile-card">

        <h2>Your Saved Profile</h2>

        <div th:if="${profile.id != null}"
             class="saved-details">

            <div class="detail-item">
                <strong>Full Name</strong>
                <p th:text="${profile.name}"></p>
            </div>

            <div class="detail-item">
                <strong>Phone Number</strong>
                <p th:text="${profile.phone}"></p>
            </div>

            <div class="detail-item">
                <strong>Skills</strong>
                <p th:text="${profile.skills}"></p>
            </div>

            <div class="detail-item">
                <strong>Location</strong>
                <p th:text="${profile.location}"></p>
            </div>

            <div class="detail-item" style="grid-column: 1 / -1;">
                <strong>About You</strong>
                <p th:text="${profile.description}"></p>
            </div>

        </div>

        <p th:if="${profile.id == null}">
            No worker profile has been saved yet.
        </p>

    </section>

    <a th:href="@{/worker}" class="back-link">
        ← Back to Worker Dashboard
    </a>

</main>

</body>
</html>
