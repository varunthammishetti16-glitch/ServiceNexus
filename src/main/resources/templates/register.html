<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ServiceNexus</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            font-family: 'DM Sans', sans-serif;
            color: #25332d;
            background:
                radial-gradient(circle at 10% 10%, #e0f3e7, transparent 35%),
                radial-gradient(circle at 90% 90%, #d9eee1, transparent 35%),
                #f5f8f6;
        }

        .auth-container {
            width: 100%;
            max-width: 490px;
            animation: appear .6s ease;
        }

        .brand {
            margin-bottom: 24px;
            text-align: center;
            font-family: 'Manrope', sans-serif;
            font-size: 29px;
            font-weight: 800;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            margin-right: 7px;
            border-radius: 11px;
            color: white;
            background: #198754;
        }

        .brand-dot { color: #198754; }

        .auth-card {
            padding: 35px;
            background: white;
            border: 1px solid #e3ebe6;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(20, 50, 35, .08);
        }

        .eyebrow {
            color: #198754;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 10px 0;
            text-align: center;
            font-family: 'Manrope', sans-serif;
            font-size: 28px;
            font-weight: 800;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #667085;
            text-align: center;
            font-size: 14px;
        }

        .field { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dce5df;
            border-radius: 10px;
            outline: none;
            font: inherit;
            transition: .2s ease;
        }

        input:focus, textarea:focus {
            border-color: #198754;
            box-shadow: 0 0 0 4px rgba(25, 135, 84, .12);
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        .password-wrap { position: relative; }

        .password-wrap input { padding-right: 65px; }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 13px;
            transform: translateY(-50%);
            border: 0;
            background: none;
            color: #198754;
            font-weight: 700;
            cursor: pointer;
        }

        .password-hint {
            margin-top: 6px;
            color: #667085;
            font-size: 12px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 7px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            color: white;
            background: #198754;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }

        .submit-btn:hover {
            background: #146c43;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(25, 135, 84, .2);
        }

        .submit-btn:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }

        .message {
            display: none;
            margin: 16px 0 0;
            padding: 12px;
            border-radius: 9px;
            text-align: center;
            font-size: 13px;
        }

        .message.success {
            display: block;
            color: #146c43;
            background: #e8f5ed;
        }

        .message.error {
            display: block;
            color: #b42318;
            background: #fff0ef;
        }

        .auth-footer {
            margin-top: 22px;
            color: #667085;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #198754;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        .back-link {
            display: block;
            margin-top: 22px;
            color: #667085;
            text-align: center;
            font-size: 13px;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .auth-card { padding: 26px 21px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>

<body>
<div class="auth-container">

    <div class="brand">
        <span class="brand-icon">S</span>ServiceNexus<span class="brand-dot">.</span>
    </div>

    <div class="auth-card">
        <div class="eyebrow">Join Our Community</div>
        <h1>Create Your Account</h1>
        <p class="subtitle">Get connected with trusted local services.</p>

        <form id="registerForm">
            <div class="field">
                <label for="name">Full Name *</label>
                <input type="text" id="name" placeholder="Enter your full name"
                       maxlength="100" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="you@example.com"
                       maxlength="254" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password *</label>
                <div class="password-wrap">
                    <input type="password" id="password"
                           placeholder="Create a password"
                           minlength="8" maxlength="72"
                           autocomplete="new-password" required>
                    <button type="button" class="toggle-password"
                            onclick="togglePassword()">Show</button>
                </div>
                <div class="password-hint">Use at least 8 characters.</div>
            </div>

            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number"
                       maxlength="20" autocomplete="tel">
            </div>

            <div class="field">
                <label for="address">Address</label>
                <textarea id="address" placeholder="Enter your address"
                          maxlength="500" autocomplete="street-address"></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Create Account ?
            </button>
        </form>

        <div id="message" class="message" role="alert" aria-live="polite"></div>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>

    <a href="/" class="back-link">? Back to Home</a>
</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const button = document.querySelector(".toggle-password");

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "Hide";
        } else {
            password.type = "password";
            button.textContent = "Show";
        }
    }

    document.getElementById("registerForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = document.getElementById("message");
        const button = document.getElementById("submitBtn");

        message.className = "message";
        message.textContent = "";
        button.disabled = true;
        button.textContent = "Creating Account...";

        const data = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            phone: document.getElementById("phone").value.trim(),
            address: document.getElementById("address").value.trim()
        };

        try {
            const response = await fetch("/api/customers/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                if (response.status === 409) {
                    throw new Error("Email already in use. Please sign in or use another email address.");
                }
                throw new Error(result.message || "Registration failed. Please check your details.");
            }

            message.className = "message success";
            message.textContent = "Account created successfully! Redirecting to sign in...";

            document.getElementById("registerForm").reset();

            setTimeout(() => {
                window.location.href = "/login";
            }, 1800);

        } catch (error) {
            message.className = "message error";
            message.textContent = error.message;
            button.disabled = false;
            button.textContent = "Create Account ?";
        }
    });
</script>
</body>
</html>
