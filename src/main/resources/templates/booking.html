
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book a Service | ServiceNexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f8f5; }
        .booking-card {
            max-width: 760px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,.07);
        }
        .form-label { font-weight: 600; }
        .btn-success { background: #198754; }
    </style>
</head>
<body>

<div class="container">
    <div class="booking-card">
        <a href="/" class="btn btn-outline-success mb-3">← Home</a>

        <h2 class="fw-bold">Request a Service</h2>
        <p class="text-muted">Your profile details will be filled automatically.</p>

        <div id="message" class="alert d-none"></div>

        <form id="bookingForm">

            <h5 class="mt-4 mb-3">Customer Details</h5>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input id="customerName" class="form-control" readonly required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="customerEmail" type="email" class="form-control" readonly required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input id="customerPhone" type="tel" maxlength="20"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Service Address</label>
                <textarea id="serviceAddress" class="form-control"
                          rows="2" maxlength="500" required></textarea>
            </div>

            <h5 class="mt-4 mb-3">Service Details</h5>

            <div class="mb-3">
                <label class="form-label">Select Service</label>
                <select id="serviceId" class="form-select" required>
                    <option value="">Loading services...</option>
                </select>
            </div>

            <div id="serviceInfo" class="alert alert-light d-none"></div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Preferred Date</label>
                    <input id="bookingDate" type="date"
                           class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Preferred Time</label>
                    <input id="preferredTime" type="time"
                           class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Describe Your Requirement</label>
                <textarea id="description" class="form-control"
                          rows="4" maxlength="1000"
                          placeholder="Explain the service you need..."
                          required></textarea>
            </div>

            <button id="submitButton" type="submit"
                    class="btn btn-success w-100 py-2">
                Submit Service Request
            </button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById("bookingForm");
    const message = document.getElementById("message");
    const serviceSelect = document.getElementById("serviceId");
    const serviceInfo = document.getElementById("serviceInfo");
    const submitButton = document.getElementById("submitButton");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "alert alert-" + type;
    }

    async function loadCustomerProfile() {
        const response = await fetch("/api/customers/me");

        if (response.status === 401 || response.status === 403) {
            window.location.href = "/login";
            return;
        }

        if (!response.ok) {
            throw new Error("Could not load customer profile.");
        }

        const customer = await response.json();

        document.getElementById("customerName").value = customer.name || "";
        document.getElementById("customerEmail").value = customer.email || "";
        document.getElementById("customerPhone").value = customer.phone || "";
        document.getElementById("serviceAddress").value = customer.address || "";
    }

    async function loadServices() {
        // This endpoint will be added in the next backend step.
        const response = await fetch("/api/customers/me/available-services");

        if (!response.ok) {
            throw new Error("Could not load available services.");
        }

        const services = await response.json();

        serviceSelect.innerHTML = '<option value="">Choose a service</option>';

        services.forEach(service => {
            const option = document.createElement("option");
            option.value = service.id;
            option.textContent =
                service.name + " - ₹" + service.price;
            serviceSelect.appendChild(option);
        });

        if (services.length === 0) {
            serviceSelect.innerHTML =
                '<option value="">No active services available</option>';
        }
    }

    serviceSelect.addEventListener("change", async function () {
        const selected = this.options[this.selectedIndex];

        if (!this.value) {
            serviceInfo.classList.add("d-none");
            return;
        }

        serviceInfo.textContent = selected.textContent;
        serviceInfo.classList.remove("d-none");
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = "Submitting...";

        const request = {
            serviceId: Number(serviceSelect.value),
            customerPhone: document.getElementById("customerPhone").value.trim(),
            serviceAddress: document.getElementById("serviceAddress").value.trim(),
            bookingDate: document.getElementById("bookingDate").value,
            preferredTime: document.getElementById("preferredTime").value,
            description: document.getElementById("description").value.trim()
        };

        try {
            const response = await fetch("/api/customers/me/bookings", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(request)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.detail || result.message || result.error ||
                    "Could not submit your request."
                );
            }

            showMessage(
                "Your service request #" + result.id +
                " was submitted successfully! Status: " + result.status,
                "success"
            );

            form.reset();
            await loadCustomerProfile();

        } catch (error) {
            showMessage(error.message, "danger");
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Submit Service Request";
        }
    });

    async function initializePage() {
        try {
            const dateInput = document.getElementById("bookingDate");
            const today = new Date();
            const localDate = new Date(
                today.getTime() - today.getTimezoneOffset() * 60000
            ).toISOString().split("T")[0];

            dateInput.min = localDate;

            await loadCustomerProfile();
            await loadServices();

        } catch (error) {
            showMessage(error.message, "danger");
        }
    }

    initializePage();
</script>

</body>
</html>
