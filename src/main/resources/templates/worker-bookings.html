<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - ServiceNexus</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .booking-card {
            background: white;
            padding: 22px;
            margin: 18px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .status {
            font-weight: bold;
            color: #2563eb;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .accept { background: #16a34a; }
        .reject { background: #dc2626; }
        .complete { background: #2563eb; }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Bookings</h1>

    <p>
        Welcome,
        <strong th:text="${workerProfile.name}">Worker</strong>
    </p>

    <p>
        <a th:href="@{/worker}">Back to Dashboard</a>
    </p>

    <div th:if="${successMessage}"
         class="message success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="message error"
         th:text="${errorMessage}">
    </div>

    <div th:if="${#lists.isEmpty(bookings)}" class="empty">
        <h3>No bookings yet</h3>
        <p>Customer booking requests will appear here.</p>
    </div>

    <div th:each="booking : ${bookings}" class="booking-card">

        <h3 th:text="${booking.service.name}">
            Service Name
        </h3>

        <p>
            <strong>Booking ID:</strong>
            <span th:text="${booking.id}"></span>
        </p>

        <p>
            <strong>Customer:</strong>
            <span th:text="${booking.customerName}"></span>
        </p>

        <p>
            <strong>Email:</strong>
            <span th:text="${booking.customerEmail}"></span>
        </p>

        <p>
            <strong>Phone:</strong>
            <span th:text="${booking.customerPhone}"></span>
        </p>

        <p>
            <strong>Address:</strong>
            <span th:text="${booking.serviceAddress}"></span>
        </p>

        <p>
            <strong>Date:</strong>
            <span th:text="${booking.bookingDate}"></span>
        </p>

        <p>
            <strong>Time:</strong>
            <span th:text="${booking.preferredTime}"></span>
        </p>

        <p>
            <strong>Description:</strong>
            <span th:text="${booking.description}"></span>
        </p>

        <p>
            <strong>Booking Amount:</strong>
            ₹<span th:text="${booking.price}"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span class="status"
                  th:text="${booking.status}">
            </span>
        </p>

        <div class="actions"
             th:if="${booking.status.name() == 'PENDING'}">

            <form th:action="@{/worker/bookings/{id}/accept(id=${booking.id})}"
                  method="post">
                <button type="submit" class="accept">
                    Accept
                </button>
            </form>

            <form th:action="@{/worker/bookings/{id}/reject(id=${booking.id})}"
                  method="post">
                <button type="submit" class="reject">
                    Reject
                </button>
            </form>

        </div>

        <div class="actions"
             th:if="${booking.status.name() == 'ACCEPTED'}">

            <form th:action="@{/worker/bookings/{id}/complete(id=${booking.id})}"
                  method="post">
                <button type="submit" class="complete">
                    Mark as Completed
                </button>
            </form>

        </div>

    </div>

</div>

</body>
</html>
