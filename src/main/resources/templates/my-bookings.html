
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | ServiceNexus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #123c69;
        }

        .navbar-brand, .navbar a {
            color: white !important;
        }

        .page-title {
            color: #123c69;
            font-weight: 700;
        }

        .booking-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.07);
            margin-bottom: 20px;
        }

        .booking-card .card-body {
            padding: 24px;
        }

        .status {
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-PENDING {
            background: #fff3cd;
            color: #856404;
        }

        .status-ACCEPTED {
            background: #cfe2ff;
            color: #084298;
        }

        .status-REJECTED {
            background: #f8d7da;
            color: #842029;
        }

        .status-COMPLETED {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-CANCELLED {
            background: #e2e3e5;
            color: #41464b;
        }

        .detail-label {
            color: #777;
            font-size: 13px;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
        }

        .empty-state {
            background: white;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
        }

        .btn-book {
            background: #123c69;
            color: white;
        }

        .btn-book:hover {
            background: #0b2948;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">ServiceNexus</a>

        <div class="ms-auto">
            <a href="/" class="text-decoration-none me-3">Home</a>
            <a href="/booking" class="text-decoration-none">Book a Service</a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
        <div>
            <h2 class="page-title">My Bookings</h2>
            <p class="text-muted">View and manage your service requests.</p>
        </div>

        <a href="/booking" class="btn btn-book">
            + Book a Service
        </a>
    </div>

    <div id="message" class="alert d-none"></div>

    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Loading your bookings...</p>
    </div>

    <div id="bookingsContainer"></div>

    <div id="emptyState" class="empty-state d-none">
        <h4>No bookings yet</h4>
        <p class="text-muted">
            You haven't requested any services yet.
        </p>
        <a href="/booking" class="btn btn-book">
            Book Your First Service
        </a>
    </div>

</div>

<script>
    const bookingsContainer =
        document.getElementById("bookingsContainer");

    const loading =
        document.getElementById("loading");

    const emptyState =
        document.getElementById("emptyState");

    const message =
        document.getElementById("message");

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "alert alert-" + type;
    }

    function formatDate(date) {
        if (!date) return "Not available";

        const parts = date.split("-");
        if (parts.length !== 3) return escapeHtml(date);

        return parts[2] + "/" + parts[1] + "/" + parts[0];
    }

    function formatTime(time) {
        if (!time) return "Not available";

        const parts = time.split(":");
        let hours = Number(parts[0]);
        const minutes = parts[1] || "00";
        const suffix = hours >= 12 ? "PM" : "AM";

        hours = hours % 12 || 12;

        return hours + ":" + minutes + " " + suffix;
    }

    async function loadBookings() {
        loading.classList.remove("d-none");
        bookingsContainer.innerHTML = "";
        emptyState.classList.add("d-none");
        message.classList.add("d-none");

        try {
            const response = await fetch(
                "/api/customers/me/bookings"
            );

            if (response.status === 401 || response.status === 403) {
                window.location.href = "/login";
                return;
            }

            if (!response.ok) {
                throw new Error("Could not load bookings.");
            }

            const bookings = await response.json();

            loading.classList.add("d-none");

            if (!bookings || bookings.length === 0) {
                emptyState.classList.remove("d-none");
                return;
            }

            bookingsContainer.innerHTML = bookings.map(booking => {
                const status = booking.status || "PENDING";

                return `
                    <div class="card booking-card">
                        <div class="card-body">

                            <div class="d-flex justify-content-between align-items-start flex-wrap mb-3">
                                <div>
                                    <h5 class="fw-bold mb-1">
                                        ${escapeHtml(booking.serviceName)}
                                    </h5>
                                    <span class="text-muted">
                                        ${escapeHtml(booking.serviceCategory)}
                                    </span>
                                </div>

                                <span class="status status-${escapeHtml(status)}">
                                    ${escapeHtml(status)}
                                </span>
                            </div>

                            <div class="row g-3">

                                <div class="col-md-4">
                                    <div class="detail-label">Booking Date</div>
                                    <div class="detail-value">
                                        ${formatDate(booking.bookingDate)}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Preferred Time</div>
                                    <div class="detail-value">
                                        ${formatTime(booking.preferredTime)}
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="detail-label">Service Price</div>
                                    <div class="detail-value">
                                        ₹${escapeHtml(booking.price)}
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="detail-label">Customer Name</div>
                                    <div class="detail-value">
                                        ${escapeHtml(booking.customerName)}
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="detail-label">Phone</div>
                                    <div class="detail-value">
                                        ${escapeHtml(booking.customerPhone)}
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="detail-label">Service Address</div>
                                    <div class="detail-value">
                                        ${escapeHtml(booking.serviceAddress)}
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="detail-label">Description</div>
                                    <div class="detail-value">
                                        ${escapeHtml(booking.description)}
                                    </div>
                                </div>

                            </div>

                            <hr>

                            <div class="d-flex justify-content-between align-items-center flex-wrap">
                                <small class="text-muted">
                                    Booking ID: #${escapeHtml(booking.id)}
                                </small>

                                ${
                                    status === "PENDING"
                                    ? `<button class="btn btn-outline-danger btn-sm"
                                        onclick="cancelBooking(${Number(booking.id)})">
                                        Cancel Booking
                                       </button>`
                                    : ""
                                }
                            </div>

                        </div>
                    </div>
                `;
            }).join("");

        } catch (error) {
            loading.classList.add("d-none");
            showMessage(error.message, "danger");
        }
    }

    async function cancelBooking(bookingId) {
        const confirmed = confirm(
            "Are you sure you want to cancel this booking?"
        );

        if (!confirmed) return;

        try {
            const response = await fetch(
                `/api/customers/me/bookings/${bookingId}/cancel`,
                {
                    method: "PUT"
                }
            );

            if (response.status === 401 || response.status === 403) {
                window.location.href = "/login";
                return;
            }

            const result = await response.json().catch(() => null);

            if (!response.ok) {
                throw new Error(
                    result?.message || "Unable to cancel this booking."
                );
            }

            showMessage("Booking cancelled successfully!", "success");

            await loadBookings();

        } catch (error) {
            showMessage(error.message, "danger");
        }
    }

    loadBookings();
</script>

</body>
</html>
